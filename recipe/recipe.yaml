schema_version: 1

context:
  name: array-api-compat
  version: "1.16.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/array_api_compat-${{ version }}.tar.gz
  sha256: c8117cb4d6c7aacaec38c2705f72509e342c20b1a716a04cb5397a611f122d51

build:
  number: 0
  noarch: python
  script: uv pip install --python ${{ PYTHON }} . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv
    - meson-python
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - array_api_compat
      python_version: ${{ python_min }}.*

about:
  summary: A wrapper around NumPy and other array libraries to make them compatible with the Array API standard
  license: MIT
  license_file: LICENSE
  homepage: https://data-apis.org/array-api-compat/

extra:
  recipe-maintainers:
    - lucascolley
    - asmeurer
    - rgommers
